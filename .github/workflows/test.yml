name: Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Create venv
        run: python -m venv venv_system
      - name: Install dependencies
        run: |
          venv_system/bin/python -m pip install -U pip
          venv_system/bin/python -m pip install -e '.[dev]'
      - name: Run tests
        run: venv_system/bin/python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
