name: Lint
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create venv
        run: python -m venv venv_system
      - name: Install dependencies
        run: |
          venv_system/bin/python -m pip install -U pip
          venv_system/bin/python -m pip install -e '.[dev]'
      - name: Ruff
        run: venv_system/bin/python -m ruff check .
      - name: Black
        run: venv_system/bin/python -m black --check .
      - name: Mypy
        run: venv_system/bin/python -m mypy .
